name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Fail-closed convert + enrollment transitions + review-api guardian stubs
      # + stub auth-tenancy + convert queue (packages/shared). Skipping
      # convertJobMayRun tests when ML lands is a regression.
      - run: npm test

  python-stubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Syntax-check ingest and convert stubs
        run: python -m compileall -q apps/ingest/src apps/convert/src
      # Fail-closed convert tests are required. Skipping them when ML lands is a regression.
      - name: Convert fail-closed and queue stub tests
        run: python -m unittest discover -s apps/convert/tests -v
      - name: Ingest stub tests
        run: python -m unittest discover -s apps/ingest/tests -v

  git-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Refuse tracked secrets, media, models, embeddings
        run: |
          set -euo pipefail
          # Directory prefixes (trailing slash) avoid flagging source docs such as
          # docs/embeddings.md. .env.example is the only env template allowed.
          pattern='(^|/)\.env($|\.)|(^|/)embeddings/|\.(pt|pth|onnx|safetensors|gguf|npy|emb|mp4|wav)$'
          allow='(^|/)\.env\.example$'
          hits="$(git ls-files | grep -E "${pattern}" | grep -vE "${allow}" || true)"
          if [ -n "${hits}" ]; then
            echo "Tracked files match forbidden biometric/media/secret patterns:"
            echo "${hits}"
            exit 1
          fi
          echo "git hygiene ok"
